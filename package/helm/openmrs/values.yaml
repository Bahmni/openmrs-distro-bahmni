replicaCount: 1

OPENMRS_APPLICATION_DATA_DIRECTORY: /openmrs/data

global:
  storageClass: ""
  nodeSelector: {}
  affinity: {}
  tolerations: {}
  TZ: "UTC"

metadata:
  labels:
    environment: dev

image:
  repository: bahmni
  name: openmrs
  tag: latest

service:
  type: ClusterIP
  port: 8080
  jmxport: 8280

config:
  OMRS_AUTO_UPDATE_DATABASE: true
  OMRS_CREATE_TABLES: true
  OMRS_DB_NAME: openmrs
  OMRS_DEV_DEBUG_PORT: ""
  OMRS_MODULE_WEB_ADMIN: false
  # Optional overrides for the names read by openmrs-runtime.properties.template.
  # When empty, they fall back to the matching OMRS_* values.
  DB_DATABASE: ""
  DB_AUTO_UPDATE: ""
  MODULE_WEB_ADMIN: ""
  OMRS_JAVA_SERVER_OPTS: ""
  OMRS_JAVA_MEMORY_OPTS: ""
  OPENELIS_HOST: openelis
  OPENELIS_PORT: '8052'
  MAIL_TRANSPORT_PROTOCOL: smtps
  MAIL_SMTP_AUTH: true
  MAIL_SMTP_STARTTLS_ENABLE: true
  MAIL_SMTP_SSL_ENABLE: true
  MAIL_DEBUG: false
  SEND_MAIL: ""
  MAIL_FROM: ""
  MAIL_SMTP_PORT: ""
  MAIL_SMTP_HOST: ""
  OMRS_DOCKER_ENV: 'false'
  OMRS_C3P0_MAX_SIZE: 50
  ODOO_HOST: ""
  ODOO_DATABASE: ""
  TEMPLATE_SERVICE_URL: "http://template-service:8080/template-service"
  OAUTH2_ENABLED: "false"
  OAUTH2_CLIENT_ID: ""
  OAUTH2_KEYCLOAK_BASE_URL: ""
  OAUTH2_KEYCLOAK_BROWSER_URL: ""
  OAUTH2_REALM: ""
  OAUTH2_SCOPE: "openid profile email"

secrets:
  OMRS_DB_HOSTNAME: ""
  OMRS_DB_USERNAME: ""
  OMRS_DB_PASSWORD: ""
  # Optional overrides; when empty, they fall back to the matching OMRS_DB_* secrets.
  DB_HOST: ""
  DB_USERNAME: ""
  DB_PASSWORD: ""
  OPENELIS_ATOMFEED_USER: ""
  OPENELIS_ATOMFEED_PASSWORD: ""
  MAIL_USER: ""
  MAIL_PASSWORD: ""
  ODOO_PASSWORD: ""
  ODOO_USERNAME: ""
  OAUTH2_CLIENT_SECRET: ""

resources: {}

autoscaling:
  enabled: false
#  minReplicas: 1
#  maxReplicas: 5
#  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

volumes:
  patientDocuments:
    capacity: "2Gi"
    claimName: openmrs-document-images-pvc
  patientImages:
    capacity: "2Gi"
    claimName: openmrs-patient-images-pvc
  initializerChecksums:
    capacity: "1Gi"
  clinicalForms:
    capacity: "1Gi"
  uploadedResults:
    capacity: "2Gi"
  uploadedFiles:
    capacity: "2Gi"
nodeSelector: {}
affinity: {}
tolerations: {}
